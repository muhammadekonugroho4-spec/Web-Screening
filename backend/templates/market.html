<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Overview — WEB-SCREENING</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0c1220">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WS Screener">
    <link rel="stylesheet" href="/static/theme.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .metrik .nilai.up { color: var(--up); }
        .metrik .nilai.down { color: var(--down); }
        .metrik .nilai.flat { color: var(--flat); }
        #tabelWrap { max-height: 62vh; overflow: auto; border-radius: var(--radius); border: 1px solid var(--line-soft); }
    </style>
</head>
<body>
    <nav class="ws-topbar">
        <a class="ws-logo" href="/"><span class="bolt">⚡</span> WEB-SCREENING</a>
        <div class="ws-topnav">
            <a href="/market" class="aktif">Market</a>
            <a href="/screener">Screener</a>
            <a href="/ai">Asisten AI</a>
            <a href="/portfolio">Portofolio</a>
            <a href="/detective">Detektif</a>
        </div>
        <span class="ws-user">IHSG</span>
    </nav>

    <div class="ws-wrap">
        <div class="ws-judul">
            <h1>📊 Market Overview</h1>
            <span class="sub">Ringkasan Pasar IHSG — update <span id="stempel" style="color:var(--acc);font-weight:700;">memuat…</span> · <span id="jam"></span></span>
        </div>

        <!-- Metrics -->
        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:13px; margin:18px 0 22px;" id="metrics">
            <div class="metrik"><div class="garis" style="background:var(--flat);"></div><div class="label">🔍 Total Saham</div><div class="nilai" id="total_saham">—</div></div>
            <div class="metrik"><div class="garis" style="background:var(--up);"></div><div class="label">🟢 Menguat</div><div class="nilai up" id="naik">—</div></div>
            <div class="metrik"><div class="garis" style="background:var(--down);"></div><div class="label">🔴 Melemah</div><div class="nilai down" id="turun">—</div></div>
            <div class="metrik"><div class="garis" style="background:var(--flat);"></div><div class="label">⚪ Stagnan</div><div class="nilai flat" id="stagnan">—</div></div>
            <div class="metrik" style="grid-column:span 2; min-width:210px;"><div class="garis" style="background:var(--gold);"></div><div class="label">🧭 Sentimen Pasar</div><div class="nilai" id="sentimen" style="font-size:20px;">—</div></div>
        </div>

        <!-- Top Tables -->
        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(430px,1fr)); gap:16px;">
            <div class="kartu">
                <div class="panel-title" style="color:var(--up);">🔥 Top Gainers</div>
                <div id="w_gainers"></div>
            </div>
            <div class="kartu">
                <div class="panel-title" style="color:var(--down);">🩸 Top Losers</div>
                <div id="w_losers"></div>
            </div>
            <div class="kartu">
                <div class="panel-title" style="color:var(--acc);">🌊 Top Volume</div>
                <div id="w_volume"></div>
            </div>
            <div class="kartu">
                <div class="panel-title" style="color:var(--gold);">💰 Top Value (Turnover)</div>
                <div id="w_value"></div>
            </div>
        </div>
    </div>

<script>
function formatAngka(v){ if(v==null||isNaN(v))return'-'; return Math.round(v).toLocaleString('id-ID'); }
function formatPct(v){ if(v==null||isNaN(v)||v===0)return'0.00%'; return (v>0?'▲ ':'▼ ')+v.toFixed(2)+'%'; }
function formatSingkatRp(v){ if(v==null||isNaN(v)||v===0)return'-'; if(v>=1e12)return'Rp '+(v/1e12).toFixed(2)+' T'; if(v>=1e9)return'Rp '+(v/1e9).toFixed(2)+' M'; if(v>=1e6)return'Rp '+(v/1e6).toFixed(2)+' Jt'; return'Rp '+Math.round(v).toLocaleString('id-ID'); }
function formatSingkatVol(v){ if(v==null||isNaN(v))return'-'; if(v>=1e6)return(v/1e6).toFixed(2)+' M lot'; if(v>=1e3)return(v/1e3).toFixed(2)+' K lot'; return Math.round(v)+' lot'; }

function tabelnya(headers, rowsHtml){
    return `<div style="max-height:340px;overflow:auto;border-radius:var(--radius-sm);border:1px solid var(--line-soft);">
        <table class="tabel"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rowsHtml || '<tr><td colspan="9" class="teks-redup">Tidak ada data.</td></tr>'}</tbody></table></div>`;
}
function selChange(v){ const c = v>0?'tx-up':(v<0?'tx-down':'tx-flat'); return `<span class="${c}">${formatPct(v)}</span>`; }

function tabelSimple(data, extraCol){
    const headers = ['Ticker','Harga','Change'].concat(extraCol ? [extraCol[0]] : []);
    const rows = data.map(r=>{
        const ex = extraCol ? `<td class="mono">${extraCol[1](r)}</td>` : '';
        return `<tr><td><strong>${r.Ticker}</strong></td><td class="mono">${formatAngka(r['Harga (Rp)'])}</td><td>${selChange(r['Change (%)'])}</td>${ex}</tr>`;
    }).join('');
    return tabelnya(headers, rows);
}

fetch('/api/market-overview').then(r=>r.json()).then(d=>{
    if(d.error){ document.querySelector('.ws-wrap').innerHTML = `<div class="kartu kartu-pad" style="color:var(--down)">${d.error}</div>`; return; }
    document.getElementById('stempel').textContent = d.ringkasan.stempel + ' WIB';
    document.getElementById('jam').textContent = '🕐 ' + new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('total_saham').textContent = d.ringkasan.total_saham.toLocaleString('id-ID');
    document.getElementById('naik').textContent = d.ringkasan.naik;
    document.getElementById('turun').textContent = d.ringkasan.turun;
    document.getElementById('stagnan').textContent = d.ringkasan.stagnan;
    const s = document.getElementById('sentimen');
    s.textContent = d.ringkasan.sentimen_teks; s.style.color = d.ringkasan.warna_sentimen;

    document.getElementById('w_gainers').innerHTML = tabelSimple(d.top_gainers);
    document.getElementById('w_losers').innerHTML  = tabelSimple(d.top_losers);
    document.getElementById('w_volume').innerHTML  = tabelSimple(d.top_volume, ['Volume', r=>formatSingkatVol(r.Volume)]);
    document.getElementById('w_value').innerHTML   = tabelSimple(d.top_value,  ['Turnover', r=>formatSingkatRp(r.Turnover)]);
}).catch(e=>{ document.querySelector('.ws-wrap').innerHTML = `<div class="kartu kartu-pad" style="color:var(--down)">Error: ${e}</div>`; });
</script>
    <script src="/static/core.js"></script>
</body>
</html>
