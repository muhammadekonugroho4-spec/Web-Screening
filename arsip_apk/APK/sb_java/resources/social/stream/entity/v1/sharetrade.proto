syntax = "proto3";

package social.stream.entity.v1;

import "google/protobuf/timestamp.proto";

option go_package = "go.stockbit.io/protos/gen/go/social/stream/entity/v1;streamentity";

message ShareTradeInfo {
  string text = 1;

  string symbol = 2;

  enum OrderType {
    ORDER_TYPE_UNSPECIFIED = 0;
    ORDER_TYPE_BUY = 1;
    ORDER_TYPE_SELL = 2;
  }
  OrderType order_type = 3;

  enum OrderStatus {
    ORDER_STATUS_UNSPECIFIED = 0;
    ORDER_STATUS_OPEN = 1;
    ORDER_STATUS_AMEND = 2;
    ORDER_STATUS_CANCEL = 3;
    ORDER_STATUS_MATCH = 4;
    ORDER_STATUS_PARTIAL_MATCH = 5;
  }
  OrderStatus status = 4;

  enum UpdatedStatus {
    UPDATED_STATUS_UNSPECIFIED = 0;
    UPDATED_STATUS_AMENDED = 1;
    UPDATED_STATUS_CANCELLED = 2;
  }
  UpdatedStatus updated_status = 5;

  string price = 6;
  string updated_price = 7;
  string parent_order_id = 8;
  google.protobuf.Timestamp order_time = 9;

  enum Label {
    LABEL_UNSPECIFIED = 0;
    LABEL_DAY_TRADE = 1;
    LABEL_SPLIT_ORDER = 2;
  }
  Label label = 10;
}
