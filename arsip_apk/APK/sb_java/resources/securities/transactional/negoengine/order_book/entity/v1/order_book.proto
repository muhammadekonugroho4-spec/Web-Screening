syntax = "proto3";

package securities.transactional.negoengine.order_book.entity.v1;

option go_package = "go.stockbit.io/protos/gen/go/securities/transactional/negoengine/order_book/entity/v1;entityv1pb";

// **Entry** represents a single price level in the order book with aggregated order information.
message Entry {
  // Number of orders at this price level.
  uint64 frequency = 1;

  // Total number of shares at this price level.
  // Note: This represents the raw share count, not lot size.
  // For example, 150 shares is stored as 150, regardless of lot size conventions.
  uint64 shares = 2;

  // Price level in IDR without decimal point.
  // For example, IDR 1,500 should be represented as 1500.
  int32 price = 3;
}

// **OrderBookSide** represents one side of the order book (either bid or ask) with aggregated statistics.
// This message is used for both buy orders (bids) and sell orders (asks).
message OrderBookSide {
  // List of orders at different price levels.
  // - For bids: ordered by price (highest to lowest)
  // - For asks: ordered by price (lowest to highest)
  // Each entry represents aggregated orders at a specific price level.
  repeated Entry entries = 1;

  // Total frequency (number of orders) across all price levels.
  uint64 total_frequency = 2;

  // Total share volume across all price levels.
  // Note: This is the raw share count, not lot size.
  uint64 total_shares = 3;
}

// **OrderBook** represents the current state of buy and sell orders for a specific asset.
// It provides a snapshot of market depth showing all bid and ask price levels.
message OrderBook {
  // Asset code (stock symbol) for this order book.
  // Must be between 4 and 24 characters.
  string asset_code = 1;

  // All bid (buy) orders with aggregated statistics.
  OrderBookSide bid = 2;

  // All ask (sell) orders with aggregated statistics.
  OrderBookSide ask = 3;
}

message AutoRejectPrice {
  // Automatic Rejection Above (ARA) - price level for automatic rejection above this price in IDR.
  // Price in IDR without decimal point. For example, IDR 1,500 is represented as 1500.
  uint64 above = 1;

  // Automatic Rejection Below (ARB) - price level for automatic rejection below this price in IDR.
  // Price in IDR without decimal point. For example, IDR 1,500 is represented as 1500.
  uint64 below = 2;
}
