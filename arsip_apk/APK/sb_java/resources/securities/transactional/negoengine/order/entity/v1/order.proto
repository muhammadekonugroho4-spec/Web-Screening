syntax = "proto3";

package securities.transactional.negoengine.order.entity.v1;

import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "securities/transactional/negoengine/entity/v1/asset.proto";
import "securities/transactional/negoengine/entity/v1/user.proto";
import "securities/transactional/negoengine/fee/entity/v1/fee.proto";

option go_package = "go.stockbit.io/protos/gen/go/securities/transactional/negoengine/order/entity/v1;entityv1pb";

// **OrderVisibility** defines how an order is visible to other users, for
// example in orderbook.
enum OrderVisibility {
  ORDER_VISIBILITY_UNSPECIFIED = 0;

  // **Private visibility** means the order is visible only to the user who
  // created it, so it must be shared manually using a reference identifier and
  // will not be shown in the orderbook.
  ORDER_VISIBILITY_PRIVATE = 1;

  // **Public visibility** means the order is visible to all users via
  // orderbook.
  ORDER_VISIBILITY_PUBLIC = 2;
}

// **CancelationDecision** represents a decision to finalize a pending
// cancelation on an order.
enum CancelationDecision {
  // **Unspecified decision.** Not allowed to be used.
  CANCELATION_DECISION_UNSPECIFIED = 0;

  // **Accept** means you agree to the counterparty's request to cancel the
  // order that already in matching phase. This acceptance withdraws both orders
  // involved in the process (poster and consumer), ending the matching process.
  CANCELATION_DECISION_ACCEPT = 1;

  // **Reject** means you decline the counterparty's request to cancel the order
  // that already in matching phase. Both of the orders remain in `MATCHING`
  // status and neither order is withdrawn; the matching process is not
  // affected.
  CANCELATION_DECISION_REJECT = 2;
}

// **SettlementSchedule** defines when the trade will be settled after matched.
enum SettlementSchedule {
  // **Unspecified settlement schedule.** Not allowed to be used.
  SETTLEMENT_SCHEDULE_UNSPECIFIED = 0;

  // **T+2 settlement schedule.** The transaction is settled two business days
  // after the trade date.
  SETTLEMENT_SCHEDULE_T_PLUS_2 = 3;
}

// **Status** represents the various states an order can be in during its lifecycle.
enum Status {
  // **Unspecified status.** Not allowed to be used.
  STATUS_UNSPECIFIED = 0;

  // **Waiting for lock** means the order is being processed and not yet active.
  STATUS_WAITING_LOCK = 1;

  // **Waiting for approval** means the order is waiting to be approved or rejected, because user placed an order with price outside range ARB ARA.
  STATUS_WAITING_APPROVAL = 2;

  // **Active** means the order is active and available for matching.
  STATUS_ACTIVE = 3;

  // **Matching** means the order has found a counter order and is waiting to send the order to IDX.
  STATUS_MATCHING = 4;

  // **Matched** means the order has been matched with a counter order and sent to IDX.
  STATUS_MATCHED = 5;

  // **Rejected** means the order was rejected by the nego engine, TCO service, or IDX itself,
  // usually due to invalid reason or purpose and other factors.
  STATUS_REJECTED = 6;

  // **Withdrawn** means the order has been withdrawn by the user
  // before it was fully executed.
  STATUS_WITHDRAWN = 7;

  // **Expired** means the order was not executed within a specified time
  // frame and has expired.
  STATUS_EXPIRED = 8;
}

// **OrderSide** identifies whether an order is a buy or sell order.
enum OrderSide {
  // **Unspecified side.** Used only as a placeholder and should be rejected.
  ORDER_SIDE_UNSPECIFIED = 0;

  // **Buy side** indicates the order adds demand for the asset (poster wants to
  // acquire shares).
  ORDER_SIDE_BUY = 1;

  // **Sell side** indicates the order supplies the asset to the market (poster
  // wants to reduce holdings or liquidate the asset).
  ORDER_SIDE_SELL = 2;
}

// **MatchingMethodSource** represents the source of the matching method.
enum MatchingMethodSource {
  // Unspecified matching method. Not allowed to be used.
  MATCHING_METHOD_SOURCE_UNSPECIFIED = 0;

  // Counterparty is found automatically by the nego engine (automatic
  // matching).
  MATCHING_METHOD_SOURCE_SYSTEM = 1;

  // Counterparty order ID is directly specified by the user (direct match).
  MATCHING_METHOD_SOURCE_USER = 2;
}

enum CancelationState {
  // Unspecified cancelation request status. Not allowed to be used.
  CANCELATION_STATE_UNSPECIFIED = 0;

  // Cancelation has been requested from the initiator side.
  CANCELATION_STATE_REQUESTED = 1;

  // Waiting for confirmation of the cancelation request from the counterparty side.
  CANCELATION_STATE_WAITING_CONFIRMATION = 2;

  // Cancelation has been accepted.
  CANCELATION_STATE_ACCEPTED = 3;
}

enum MatchingState {
  // Unspecified matching state. Not allowed to be used.
  MATCHING_STATE_UNSPECIFIED = 0;

  // Matching has been offered from the initiator side, initiator could be done
  // by either system (auto-matching) or by user input (direct matching),
  // initiator here is the TAKER/CONSUMER.
  MATCHING_STATE_OFFERED = 1;

  // Waiting for confirmation of the matching request from the counterparty side
  // or the POSTER/MAKER.
  MATCHING_STATE_WAITING_CONFIRMATION = 2;

  // Matching has been approved by the POSTER/MAKER.
  MATCHING_STATE_APPROVED = 3;

  // Matching has been rejected by the POSTER/MAKER.
  MATCHING_STATE_REJECTED = 4;
}

message Order {
  // Primary key generated using snowflake algorithm.
  uint64 id = 1;

  // User friendly order ID / formatted nego ID that users can see on UI and can
  // be used to select counterparty order.
  //  - **Format:** `NG{XXXXXXXXXX}`
  //  - Prefix: `NG`.
  //  - Random suffix: 10 alphanumeric characters (A–Z, 0–9) generated by a
  //    secure random function to prevent guessing.
  //  - Example: NG091025M5GX.
  //  - Length: 12 characters.
  string reference_id = 2;

  // Multi user identifiers related to the order.
  securities.transactional.negoengine.entity.v1.UserID user_id = 3;

  // Simply determines whether the order is a buy or sell order.
  OrderSide order_side = 4;

  // Related securities asset information to the order.
  securities.transactional.negoengine.entity.v1.Asset asset = 5;

  // Price per share for the order, in IDR and without decimal point. For
  // example, IDR 1000 per share.
  uint64 order_price = 6;

  // Number of shares involved in the order, usually 100 shares is 1 lot.
  uint64 shares = 7;

  // Current status of the order.
  Status status = 8;

  // Counterparty order ID is always filled, but not always during order
  // creation.
  //
  //  - If the matching method source is "user", this field is filled
  //    immediately.
  //  - If the matching method source is "system", it will be filled later
  //    during the matching phase.
  //
  // The ID shown is the system primary ID, not the reference ID.
  uint64 counterparty_order_id = 9;

  // IDX-issued counterparty broker code (two uppercase letters).
  string counterparty_broker_code = 10;

  // **Order ID from the transaction** (Carina system).
  // This field is populated after the order has been sent to and accepted by
  // the TCO (Trading Core Order) service. It remains empty until
  // the order successfully hits the TCO service.
  string carina_order_id = 11;

  // Indicates how the order was matched with it's counterparty.
  MatchingMethodSource matching_method_source = 12;

  // Settlement schedule associated with the order, indicates when the trade
  // will be settled after matched.
  SettlementSchedule settlement_schedule = 13;

  // Whether the order is private or public.
  OrderVisibility order_visibility = 14;

  // Fees associated with the order.
  securities.transactional.negoengine.fee.entity.v1.OrderFees fees = 15;

  // Annotations related to the order such as purpose, reason, and reject reason.
  OrderAnnotations annotations = 16;

  // State of the cancelation request between counterparties.
  CancelationState cancelation_state = 17;

  // Shows whether the order price is outside the auto reject range (ARA/ARB) at
  // the time when the order was created, but this field is also can be updated
  // later if the order is sent to exchange in the next day and at that day when
  // the order is sent, the auto reject range may already change.
  bool is_price_outside_auto_reject_range = 18;

  // The date when the transaction is executed
  google.type.Date transaction_date = 19;

  // The date when the settlement of the transaction occurs.
  google.type.Date settlement_date = 20;

  // Timestamp when the order is created.
  google.protobuf.Timestamp created_at = 21;

  // Timestamp when the order is last updated.
  google.protobuf.Timestamp updated_at = 22;

  // Timestamp when the order was activated.
  google.protobuf.Timestamp activated_at = 23;

  // Timestamp when the order started matching.
  google.protobuf.Timestamp matching_at = 24;

  // Timestamp when the order expires.
  google.protobuf.Timestamp expired_at = 25;

  // State of the matching request of orders that has met it's counterparty
  // between POSTER/MAKER and TAKER/CONSUMER.
  MatchingState matching_state = 26;

  // Multi user identifiers related to the counterparty of the order.
  securities.transactional.negoengine.entity.v1.UserID counterparty_user_id = 27;
}

message OrderAnnotations {
  // Purpose of why this nego order is created.
  //
  // Use cases for this field:
  //  1. Will be filled when the order price is below ARB (Auto Rejection Bawah)
  //     or above ARA (Auto Rejection Atas) thresholds.
  optional string purpose = 1;

  // Reason behind the anomaly of the order input.
  //
  // Use cases for this field:
  //  1. Will be filled when the order price is below ARB (Auto Rejection Bawah)
  //     or above ARA (Auto Rejection Atas) thresholds.
  optional string reason = 2;

  // Display message that the users will see on the UI.
  //
  // Use cases for this field:
  //  1. Will be filled when the order is rejected by backoffice (dealer).
  //  2. Will be filled when the order is rejected due to failed matching
  //     (suspended account, insufficient balance, etc).
  optional string display_message = 3;
}

// **SettlementMethod** defines how a negotiated transaction is settled between counterparties.
// It specifies the settlement mechanism used, as determined by exchange rules
// or counterparty agreements.
enum SettlementMethod {
  // Unspecified settlement method. Not allowed to be used.
  SETTLEMENT_METHOD_UNSPECIFIED = 0;

  // **Versus Payment** - Settlement where securities and cash are exchanged
  // simultaneously through the central clearing system. Counterparty is found
  // automatically by the negotiation engine through automatic matching.
  SETTLEMENT_METHOD_VERSUS_PAYMENT = 1;
}

message OrderPreview {
  // **Counterparty broker code** IDX-issued counterparty broker code (two uppercase letters).
  string counterparty_broker_code = 1;

  // **Settlement method** defines how a negotiated transaction is settled between counterparties.
  // It specifies the settlement mechanism used, as determined by exchange rules
  // or counterparty agreements.
  securities.transactional.negoengine.order.entity.v1.SettlementMethod settlement_method = 2;

  // **Transaction date** The date when the transaction will be executed, the date is always
  // on a market day, cannot be in weekends or holidays.
  google.protobuf.Timestamp transaction_date = 3;

  // **Settlement date** The date when the settlement of the transaction occurs, the date
  // is always on a market day, cannot be in weekends or holidays.
  google.protobuf.Timestamp settlement_date = 4;

  // **Settlement schedule** defines when the trade will be settled after matched.
  securities.transactional.negoengine.order.entity.v1.SettlementSchedule settlement_schedule = 5;

  // **Require verification** can be used as a reference to initiate a verification challenge or not.
  // This value is determined from shares and price in the request.
  bool require_verification = 6;
}

// **BulkConfirmDecision** defines the decision made by Stockbit Operations
// for orders that are currently waiting approval.
//
// This is typically used when an order has been placed outside the
// allowed ARA/ARB (Auto Reject Atas/Bawah) range and
// requires manual review by operations.
enum BulkConfirmDecision {
  // **Unspecified decision** Not allowed to be used. Requests containing this value
  // are considered invalid.
  BULK_CONFIRM_DECISION_UNSPECIFIED = 0;

  // **Approve** indicates that the order placed outside the ARA/ARB price range
  // has been approved by Stockbit Operations.
  BULK_CONFIRM_DECISION_APPROVE = 1;

  // **Reject** indicates that the order placed outside the ARA/ARB price range
  // has been rejected by Stockbit Operations.
  BULK_CONFIRM_DECISION_REJECT = 2;
}

// BulkConfirmRejectReason defines the reason why an order placed outside the
// allowed ARA/ARB price range has been rejected by Stockbit Operations.
//
// This field is only used when BulkConfirmDecision is BULK_CONFIRM_DECISION_REJECT.
enum BulkConfirmRejectReason {
  // Unspecified reject reason. Not allowed to be used.
  BULK_CONFIRM_REJECT_REASON_UNSPECIFIED = 0;

  // **Invalid Reason** means that the provided reason
  // for placing the order outside ARA/ARB price range is invalid.
  BULK_CONFIRM_REJECT_REASON_INVALID_REASON = 1;

  // **Invalid Purpose** means that the provided purpose
  // for placing the order outside ARA/ARB price range is invalid.
  BULK_CONFIRM_REJECT_REASON_INVALID_PURPOSE = 2;

  // **Invalid Reason and Purpose** means that both the reason and purpose
  // for placing the order outside ARA/ARB price range are invalid.
  BULK_CONFIRM_REJECT_REASON_INVALID_REASON_AND_PURPOSE = 3;

  // **Others** means that the order was rejected
  // for other reasons not covered by the above categories.
  BULK_CONFIRM_REJECT_REASON_OTHERS = 4;
}

// **ConfirmMatchingDecision** represents a decision to finalize a pending
// matching confirmation on an order.
enum ConfirmMatchingDecision {
  // **Unspecified decision.** Not allowed to be used.
  CONFIRM_MATCHING_DECISION_UNSPECIFIED = 0;

  // **Approve** means agree to proceed with the matching of the order. This
  // approval confirms the match with the counterparty and allows the order to
  // proceed to settlement.
  CONFIRM_MATCHING_DECISION_APPROVE = 1;

  // **Reject** means decline the matching of the order. This rejection
  // aborts the current matching process and returns the order to an available
  // state for future matching attempts.
  CONFIRM_MATCHING_DECISION_REJECT = 2;
}
