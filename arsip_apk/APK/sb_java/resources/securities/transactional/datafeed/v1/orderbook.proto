syntax = "proto3";

package securities.transactional.datafeed.v1;

import "google/protobuf/timestamp.proto";
import "securities/transactional/datafeed/v1/entity.proto";

option java_package = "com.stockbit.protobuf.securities.transactional.datafeed.v1.datafeed";
option java_multiple_files = true;

message OrderBookHeader {
  string stock_symbol = 1 [json_name = "stock_symbol"];
  securities.transactional.datafeed.v1.Change change = 2;
  Price price = 3;
  google.protobuf.Timestamp time = 4;
}

message OrderBookBody {
  string stock_symbol = 1 [json_name = "stock_symbol"];
  repeated securities.transactional.datafeed.v1.Bid bid = 2;
  repeated securities.transactional.datafeed.v1.Offer offer = 3;
  google.protobuf.Timestamp time = 4;
}

message Price {
  double open = 1;
  double high = 2;
  double low = 3;
  double avg = 4;
  double last = 5;
  double prev = 6;
  double frequency = 7;
  double fbuy = 8;
  double fsell = 9;
  double lot = 10;
  double val = 11;
}
