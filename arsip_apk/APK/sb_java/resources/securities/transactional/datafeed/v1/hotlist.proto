syntax = "proto3";

package securities.transactional.datafeed.v1;

import "financial/emitten/entity/v2/company_detail.proto";
import "google/protobuf/timestamp.proto";
import "securities/transactional/datafeed/v1/entity.proto";
option java_package = "com.stockbit.protobuf.securities.transactional.datafeed.v1.datafeed";
option java_multiple_files = true;

message Hotlist {
  string stock_symbol = 1 [json_name = "stock_symbol"];
  double last_price = 2 [json_name = "last_price"];
  securities.transactional.datafeed.v1.Change change = 3;
  bool uma = 4;
  financial.emitten.entity.v2.CorpAction corp_action = 5 [json_name = "corp_action"];
  repeated financial.emitten.entity.v2.Notation notations = 6;
  string stock_name = 7 [json_name = "stock_name"]; // ex: Bumi Resources Tbk
  string icon_url = 8 [json_name = "icon_url"]; // ex: https://stockbit.com/logos/companies/AALI.png
}

message Top20 {
  repeated Hotlist hotlist = 1;
  google.protobuf.Timestamp time = 2;
  securities.transactional.datafeed.v1.Top20Type type = 3;
}
