syntax = "proto3";

package securities.trm.core.portfolio.entity.v2;

import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/money.proto";
import "securities/transactional/negoengine/order/entity/v1/order.proto";
import "securities/trm/core/info/public/v1/entity.proto";
import "securities/trm/core/smart_order/entity/v1/order.proto";
import "securities/trm/core/smart_order/trailing_stop/order/entity/v1/order.proto";
import "securities/trm/core/smart_order/trailing_stop/order/entity/v1/price_algorithm.proto";

option go_package = "go.stockbit.io/protos/gen/go/securities/trm/core/portfolio/entity/v2;portfolio";

// PortfolioListSummary contains summary of portfolio list
message PortfolioSummary {
  message Trading {
    double balance = 1; // previously tradingbalance
  }
  message Amount {
    double invested = 1;
    double allocated = 2;
    double credit_limit = 3; // previously amount_creditlimit
  }
  message ProfitLoss {
    double net = 1;
    double unrealised = 2; // previously unrealised_profitloss
    double realised = 3; // previously realised_profitloss
  }
  message Buffer {
    double value = 1;
    double percentage = 2;
  }
  message Debt {
    // PRD Margin Buffer: https://www.notion.so/stockbit/Margin-Trading-System-1b5693993f7e8054a20bd2011e09febd?source=copy_link#24f693993f7e80adb44ed9a93ccddc9b
    message Buffer {
      double value = 1;
      double percentage = 2;
    }

    double ratio = 1; // e.g 93.55 percent
    double total = 2;
    double market_value = 3;
    Buffer buffer = 4;
  }
  Trading trading = 1;
  Amount amount = 2;
  ProfitLoss profit_loss = 3;
  double gain = 4;
  double equity = 5;
  Debt debt = 6;
}

// PortfolioPrice contains price information in portfolio for one symbol
message PortfolioPrice {
  message Average {
    double price = 1; // previously price_average
    double fee = 2; // previously price_average_fee
  }
  double latest = 1; // previously price_latest
  Average average = 2;
  // deleted: price
}

message PortfolioQty {
  message Qty {
    double lot = 1;
    double share = 2;
  }
  double stock_on_hand = 1;
  Qty available = 2; // previously available_lot, available_share. this will be T+2 (previously TX)
  Qty balance = 3; // previously balance_lot, balance_share. this still will be TX (since we need to show it on porto)
  Qty unsettled = 4; // this will be TX - T2, so FE can know the net unsettled stock
  // unsettled_until_at will be always the next day, since SAS doesn't have any proper settlement schedule for Stock
  // and also it is very rare to have transaction that have settle date more than T+3, so it will be fine.
  google.type.Date unsettled_until_at = 5;
}

message PortfolioAsset {
  message Unrealised {
    double market_value = 1; // previously unrealised_marketvalue
    double profit_loss = 2; // previously unrealised_profitloss
    double gain = 3; // previously unrealised_gain
  }
  Unrealised unrealised = 1;
  double amount_invested = 2;
}

message PortfolioFlags {
  bool allow_order = 1;
  bool have_smart_order = 2; // previously have_smartorder
  bool can_buy = 3;
  bool can_sell = 4;
  bool allow_market_order = 5;
}

// Side defines sides for an order
enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum PlatformOrderType {
  PLATFORM_ORDER_TYPE_UNSPECIFIED = 0;
  PLATFORM_ORDER_TYPE_LIMIT_DAY = 1;
  PLATFORM_ORDER_TYPE_MARKET_FAK = 2;
  PLATFORM_ORDER_TYPE_FAST_ORDER = 3;
}

enum SmartOrderLabelType { // this number same like AutoOrderLabel
  SMART_ORDER_LABEL_TYPE_UNSPECIFIED = 0;
  SMART_ORDER_LABEL_TYPE_AUTO_BUY = 1;
  SMART_ORDER_LABEL_TYPE_STOP_LOSS = 2;
  SMART_ORDER_LABEL_TYPE_TAKE_PROFIT = 3;
  SMART_ORDER_LABEL_TYPE_TRAILING_STOP = 5;
  SMART_ORDER_LABEL_TYPE_LIMIT_IF_TOUCHED = 6;
  SMART_ORDER_LABEL_TYPE_BRACKET_ORDER = 7;
  SMART_ORDER_LABEL_TYPE_VOLUME_TRIGGER_ORDER = 8;
}

enum ActionTarget {
  ACTION_TARGET_UNSPECIFIED = 0;
  ACTION_TARGET_REGULAR = 1;
  ACTION_TARGET_DAY_TRADE = 2;
  ACTION_TARGET_LEGACY_SMARTORDER = 3;
  ACTION_TARGET_TRAILING_STOP = 4;
  ACTION_TARGET_STOP_ORDER = 5;
  ACTION_TARGET_BRACKET_ORDER = 6;
  ACTION_TARGET_VOLUME_TRIGGER_ORDER = 7;
  ACTION_TARGET_NEGO_ENGINE = 8;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

message ForceSell {
  enum DayTradeForceSell {
    DAY_TRADE_FORCE_SELL_UNSPECIFIED = 0;
    DAY_TRADE_FORCE_SELL_DEBT_RATIO = 1;
    DAY_TRADE_FORCE_SELL_TIME_LIMIT = 2;
  }
  enum MarginForceSell {
    MARGIN_FORCE_SELL_UNSPECIFIED = 0;
    MARGIN_FORCE_SELL_DEBT_RATIO = 1;
    MARGIN_FORCE_SELL_CALL_COUNTER = 2;
  }

  bool is_force_sell = 1;
  oneof event {
    DayTradeForceSell day_trade = 2;
    MarginForceSell margin = 3;
  }
}

// Order defines information on a single order
message Order {
  // Amount contains amount-related information for order
  message Amount {
    message Fee {
      message Matched {
        double amount = 1; // previously amount_matched_fee
        double broker = 2; // previously amount_matched_broker_fee
        double exchange = 3; // previously amount_matched_broker_fee
      }
      double amount = 1; // previously amount_fee
      double open = 2; // previously amount_open_fee
      double invested = 3; // previously amount_invested_fee
      Matched matched = 4;
    }
    double invested = 1; // previously amount_invested
    double matched = 2; // previously amount_matched
    double matched_total = 3; // previously amount_matched_total
    double open = 4; // previously amount_open
    double amount = 5; // previously amount
    Fee fee = 6;
  }

  // Price contains price-related information for order
  message Price {
    message Average {
      double price = 1; // previously price_average
      double fee = 2; // previously price_average_fee
    }
    double order = 1; // previously price_order
    Average average = 2;
  }

  // Time contains time-related information for order
  message Time {
    google.protobuf.Timestamp order = 1; // previously time
    google.protobuf.Timestamp open = 2; // previously time_open
    google.protobuf.Timestamp match = 3; // previously time_match
  }

  // TimeUTC contains time-related information for order in UTC timezone
  message TimeUTC {
    google.protobuf.Timestamp order = 1; // previously time
    google.protobuf.Timestamp open = 2; // previously time_open
    google.protobuf.Timestamp match = 3; // previously time_match
    google.protobuf.Timestamp gtc_expired = 4; // Only filled for GTC order
  }

  // Action defines do-able action for order
  message Action {
    bool can_amend = 1 [deprecated = true]; // will be deprecated, use amend_target instead
    bool can_cancel = 2 [deprecated = true]; // will be deprecated, use cancel_target instead
    ActionTarget amend_target = 3; // if unspecified, cannot amend
    ActionTarget cancel_target = 4; // if unspecified, cannot cancel
  }

  // SmartOrder contains information related with smart order
  message SmartOrder {
    message TrailingStop {
      uint64 id = 1;
      securities.trm.core.smart_order.trailing_stop.order.entity.v1.PriceAlgorithm price_algorithm = 2;
      google.type.Money stop_price = 3;
    }

    string order_id = 1; // previously smart_orderid
    string label = 2;
    double trigger_price = 3;
    int64 config_type = 4;
    TrailingStop trailing_stop = 5;
    repeated BracketOrderChild bracket_order_children = 6;
    string parent_id = 7;
    double parent_price = 8;
    OrderType order_type = 9;
    double amount_with_fee = 10;
    securities.trm.core.smart_order.trailing_stop.order.entity.v1.OrderStatus status = 11;
    securities.trm.core.smart_order.entity.v1.OrderExpiryType expiry_type = 12;
  }

  // GTC contains information related with GTC order
  message GTC {
    enum GTCStatus {
      GTC_STATUS_UNSPECIFIED = 0;
      GTC_STATUS_OPEN = 1;
      GTC_STATUS_MATCH = 2;
      GTC_STATUS_WITHDRAWN = 3;
    }
    bool is_gtc = 1; // previously gtc
    GTCStatus status = 2; // previously gtc_status
    // deleted: gtc_expired
  }

  // Qty contains qty-related information for order
  message Qty {
    double lot_done = 1; // previously order_done
    double lot_open = 2; // previously order_open
    double lot_total = 3; // previously order_total
  }

  enum DayTradeForceSell {
    DAY_TRADE_FORCE_SELL_UNSPECIFIED = 0;
    DAY_TRADE_FORCE_SELL_DEBT_RATIO = 1;
    DAY_TRADE_FORCE_SELL_TIME_LIMIT = 2;
  }

    enum MarginForceSell {
        MARGIN_FORCE_SELL_UNSPECIFIED = 0;
        MARGIN_FORCE_SELL_DEBT_RATIO = 1;
        MARGIN_FORCE_SELL_CALL_COUNTER = 2;
    }


    // DayTrade contains information related with day trade
  message DayTrade {
    bool is_day_trade = 1; // show DT label if true
    DayTradeForceSell force_sell_event = 2; // deprecated, use force_sell instead
  }

    message ForceSell {
        bool is_force_sell = 1;
        oneof event {
            DayTradeForceSell day_trade = 2;
            MarginForceSell margin = 3;
        }
    }

  string order_id = 1;
  string market_order_id = 2;
  string symbol = 3;
  string status_text = 4;
  string message = 5;
  Side side = 6;
  Time time = 7 [deprecated = true]; // Deprecated due to inconsistent and wrong value with timezone related;
  Qty qty = 8;
  Price price = 9;
  Amount amount = 10;
  Action action = 11;
  SmartOrder smart_order = 12;
  GTC gtc = 13;
  DayTrade day_trade = 14;
  LeverageType leverage_type = 15;
  bool is_sharia = 16;
  SecuritiesKind securities_kind = 17;
  PlatformOrderType platform_order_type = 18;
  TimeUTC time_utc = 19;

  ForceSell force_sell = 20;
  NegoInApp nego_in_app = 21;

  string prev_order_id = 22;
  string group_id = 23;
  CorpActionInfo corpaction_info = 24; // only populated for pending dividend entries
}

message OrderDetail {
  // Amount contains amount-related information for order
  message Amount {
    message Fee {
      message Matched {
        double amount = 1; // previously amount_matched_fee
        double broker = 2; // previously amount_matched_broker_fee
        double exchange = 3; // previously amount_matched_broker_fee
      }
      double amount = 1; // previously amount_fee
      double open = 2; // previously amount_open_fee
      double invested = 3; // previously amount_invested_fee
      Matched matched = 4;
    }
    double invested = 1; // previously amount_invested
    double matched = 2; // previously amount_matched
    double matched_total = 3; // previously amount_matched_total
    double open = 4; // previously amount_open
    double amount = 5; // previously amount
    Fee fee = 6;
  }

  // Price contains price-related information for order
  message Price {
    message Average {
      double price = 1; // previously price_average
      double fee = 2; // previously price_average_fee
      double portfolio = 3; // portfolio avg price ATM when sell happend
    }
    double order = 1; // previously price_order
    Average average = 2;
  }

  // Time contains time-related information for order
  message Time {
    google.protobuf.Timestamp ordered_at = 1; // previously time
    google.protobuf.Timestamp opened_at = 2; // previously time_open
    google.protobuf.Timestamp matched_at = 3; // previously time_match
  }

  // TimeUTC contains time-related information for order in UTC timezone
  message TimeUTC {
    google.protobuf.Timestamp ordered_at = 1; // previously time
    google.protobuf.Timestamp opened_at = 2; // previously time_open
    google.protobuf.Timestamp matched_at = 3; // previously time_match
    google.protobuf.Timestamp gtc_expired_at = 4; // Only filled for GTC order
  }

  // Action defines do-able action for order
  message Action {
    bool can_amend = 1 [deprecated = true]; // will be deprecated, use amend_target instead
    bool can_cancel = 2 [deprecated = true]; // will be deprecated, use cancel_target instead
    ActionTarget amend_target = 3; // if unspecified, cannot amend
    ActionTarget cancel_target = 4; // if unspecified, cannot cancel
  }

  // SmartOrder contains information related with smart order
  message SmartOrder {
    enum ConfigPriceType {
      CONFIG_PRICE_TYPE_UNSPECIFIED = 0;
      CONFIG_PRICE_TYPE_ABOVE = 1;
      CONFIG_PRICE_TYPE_BELOW = 2;
    }

    message TrailingStop {
      uint64 id = 1;
      securities.trm.core.smart_order.trailing_stop.order.entity.v1.PriceAlgorithm price_algorithm = 2;
      google.type.Money stop_price = 3;
    }

    message VolumeTriggerOrder {
      uint64 trigger_volume = 1;
      uint64 evaluation_price = 2;
      OrderBookSide evaluation_order_book_side = 3;
    }

    string id = 1; // previously smart_orderid
    string label = 2;
    double trigger_price = 3;
    ConfigPriceType config_type = 4;
    TrailingStop trailing_stop = 5;
    repeated BracketOrderChild bracket_order_children = 6;
    string parent_id = 7;
    double parent_price = 8;
    OrderType order_type = 9;
    VolumeTriggerOrder volume_trigger_order = 10;
    google.protobuf.Timestamp expired_at = 11;
  }

  // GTC contains information related with GTC order
  message GTC {
    enum GTCStatus {
      GTC_STATUS_UNSPECIFIED = 0;
      GTC_STATUS_OPEN = 1;
      GTC_STATUS_MATCH = 2;
      GTC_STATUS_WITHDRAWN = 3;
    }
    bool is_gtc = 1; // previously gtc
    GTCStatus status = 2; // previously gtc_status
    // deleted: gtc_expired
  }

  // Qty contains qty-related information for order
  message Qty {
    double lot_done = 1; // previously order_done
    double lot_open = 2; // previously order_open
    double lot_total = 3; // previously order_total
  }

  // DayTrade contains information related with day trade
  message DayTrade {
    bool is_day_trade = 1; // show DT label if true
    ForceSell.DayTradeForceSell force_sell_event = 2 [deprecated = true]; // only available if force-sell, please use force_sell instead.
    string message = 3 [deprecated = true]; // unused
  }

  string order_id = 1;
  string market_order_id = 2;
  string symbol = 3;
  string status_text = 4;
  string message = 5;
  Side side = 6;
  Time time = 7 [deprecated = true]; // Deprecated due to inconsistent and wrong value with timezone related;
  Qty qty = 8;
  Price price = 9;
  Amount amount = 10;
  Action action = 11;
  SmartOrder smart_order = 12;
  GTC gtc = 13;
  DayTrade day_trade = 14;
  LeverageType leverage_type = 15;
  bool is_sharia = 16;
  PlatformOrderType platform_order_type = 17;
  TimeUTC time_utc = 18;

  ForceSell force_sell = 19;
  securities.trm.core.info.public.v1.FullCallAuctionCycle full_call_auction_cycle = 20;
  NegoInApp nego_in_app = 21;
}

message CorpActionInfo {
  enum ActionType {
    ACTION_TYPE_UNSPECIFIED = 0;
    ACTION_TYPE_DIVIDEND_CASH = 1;
    ACTION_TYPE_DIVIDEND_STOCK = 2;
    ACTION_TYPE_BONUS_STOCK = 3;
  }
  string corpact_id = 1;
  ActionType action_type = 2;
  string status = 3;
}

message BracketOrderChild {
  message PriceChild {
    double order = 1;
    double price_difference_percentage = 2;
    double trigger = 3;
  }

  message GTC {
    enum GTCStatus {
      GTC_STATUS_UNSPECIFIED = 0;
      GTC_STATUS_OPEN = 1;
      GTC_STATUS_MATCH = 2;
      GTC_STATUS_WITHDRAWN = 3;
    }
    bool is_gtc = 1;
    GTCStatus status = 2;
  }

  message ProfitLoss {
    double amount = 1;
    double percentage = 2;
  }

  // Action defines do-able action for order
  message Action {
    ActionTarget amend_target = 1; // if unspecified, cannot amend
    ActionTarget cancel_target = 2; // if unspecified, cannot cancel
  }

  string order_id = 1;
  string symbol = 2;
  Side side = 3;
  PriceChild price = 4;
  double amount = 5;
  GTC gtc = 6;
  string status_text = 7;
  SmartOrderLabelType label = 9;
  ProfitLoss profit_loss = 10;
  Action action = 11;
  double lot_ordered = 12;
  double lot_done = 13;
  double amount_ordered = 14;
  double amount_done = 15;
  PlatformOrderType platform_order_type = 16;
}

message Company {
  string name = 1;
  // icon_url example: https://assets.stockbit.com/logos/companies/RATU.png
  // at the moment this field is added no versioning included on the url, so please avoid caching on the client side for now
  // but it can include versioning in the future.
  string icon_url = 2;
}

message ExerciseData {
  message Date {
    google.type.Date listing = 1;
    google.type.Date expired = 2;
    google.type.Date mature = 3;
    google.type.Date start = 4; // previously exercise_start_date
    google.type.Date end = 5; // previously exercise_end_date
  }
  bool active = 1; // previously type is int64
  string type = 2;
  double price = 3;
  Date date = 4;
  string info = 9; // Exercise information, eg: Hubungi customer service kami apabila ingin mengkonversi KAEF01CB menjadi saham KAEF.
}

message Haircut {
  double trading_limit = 1;
  double margin_trading = 2;
}

message MarginInfo {
  bool to_be_delisted = 1;
  google.protobuf.Timestamp delisted_date = 2;
}

message PortfolioItem {
  string symbol = 1;
  Company company = 2;
  PortfolioQty qty = 3;
  PortfolioPrice price = 4;
  PortfolioAsset asset = 5;
  PortfolioFlags flags = 6;
  ExerciseData exercise = 7;
  string type = 8; // Type, eg: bond
  // deleted: sell_open, sell_open_today, total
  bool is_sharia = 9;
  Haircut haircut = 10;
  MarginInfo margin_info = 11;
}

message PortfolioDetail {
  message Bond {
    message Coupon {
      string year_rate = 1; // Percentage coupon rate/year, eg: 5.00%
      string payment_date = 2; // Coupon payment date, eg: 23 Aug 2023
      string distribution = 3; // Coupun distribution, eg: Every 6 Months
    }
    Coupon coupon = 1; // Describe for detail coupon
    string maturity = 2; // Bond maturity date, eg: 23 Feb 2028
  }

  string symbol = 1;
  Company company = 2;
  PortfolioQty qty = 3;
  PortfolioPrice price = 4;
  PortfolioAsset asset = 5;
  PortfolioFlags flags = 6;
  ExerciseData exercise = 7;
  Bond bond = 8; // Describe for detail bond
  bool can_create_smart_order = 9; // previously show_create_smartorder
  repeated string info = 10; // Bond information, eg: Periode exercise mulai dari 20 Februari 2023, 10:00 WIB hingga 21 Februari 2023, 10:00 WIB.
  // deleted: security
  bool is_sharia = 11;
  MarginInfo margin_info = 12;
}

// PortfolioList defines data on response PortfolioListResponse
message PortfolioList {
  // PortfolioListInfo contains info of portfolio list
  message SmartOrderInfo {
    bool can_create = 1; // previously show_create_smartorder
    string info = 2; // previously auto_order_info // eg: Auto Order <b>%s</b> dibatalkan secara otomatis karena terdapat aksi korporasi yang sedang berlangsung.
    bool day_trade_can_create = 3; // indicates if day trade data can create smart order
  }
  SmartOrderInfo smart_order_info = 1;
  securities.trm.core.portfolio.entity.v2.PortfolioSummary summary = 2;
  repeated securities.trm.core.portfolio.entity.v2.PortfolioItem results = 3; // previously result
  repeated securities.trm.core.portfolio.entity.v2.PortfolioItem day_trade = 4;
}

// NegoInApp contains information related with nego engine
message NegoInApp {
  enum SettlementMethod {
    SETTLEMENT_METHOD_UNSPECIFIED = 0;
    SETTLEMENT_METHOD_VERSUS_PAYMENT = 1;
  }

  enum SettlementSchedule {
    SETTLEMENT_SCHEDULE_UNSPECIFIED = 0;
    SETTLEMENT_SCHEDULE_T_PLUS_2 = 3;
  }

  message Date {
    google.protobuf.Timestamp transaction = 1;
    google.protobuf.Timestamp settlement = 2;
  }

  message OrderFee {
    double over_the_counter = 1;
    double broker = 2;
    double exchange = 3;
  }

  uint64 id = 1;
  string reference_id = 2;
  string counterparty_broker_code = 3;
  SettlementMethod settlement_method = 4;
  SettlementSchedule settlement_schedule = 5;
  Date date = 6;
  OrderFee fee = 7;
  string reason = 8;
  string purpose = 9;
  securities.transactional.negoengine.order.entity.v1.CancelationState cancelation_state = 10;
  securities.transactional.negoengine.order.entity.v1.OrderVisibility visibility = 11;
  securities.transactional.negoengine.order.entity.v1.MatchingState matching_state = 12;
  string counterparty_username = 13;
  bool is_under_riskmgmt_review = 14;
  uint64 counterparty_user_id = 15;
}

enum LeverageType {
  LEVERAGE_TYPE_TRADING_UNSPECIFIED = 0;
  LEVERAGE_TYPE_TRADING_BALANCE = 1;
  LEVERAGE_TYPE_TRADING_LIMIT = 2;
  LEVERAGE_TYPE_BASIC_LIMIT = 3;
  LEVERAGE_TYPE_TEMP_LIMIT = 4;
  LEVERAGE_TYPE_DAY_TRADE = 5;
  LEVERAGE_TYPE_MARGIN_TRADING = 6;
}

enum SecuritiesKind {
  SECURITIES_KIND_UNSPECIFIED = 0;
  SECURITIES_KIND_STOCK = 1;
  SECURITIES_KIND_BOND = 2;
}

enum OrderBookSide {
  ORDER_BOOK_SIDE_UNSPECIFIED = 0;
  ORDER_BOOK_SIDE_BID = 1; // Represents the Buy order queue side of the order book.
  ORDER_BOOK_SIDE_ASK = 2; // Represents the Sell order queue side of the order book.
}