syntax = "proto3";

package securities.trm.core.smart_order.entity.v1;

option go_package = "go.stockbit.io/protos/gen/go/securities/trm/core/smart_order/entity/v1;soentity";

// Side could be used to all types of orders whether it's smart order or not.
enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

// Expiry type could be used to all types of orders whether it's smart order or
// not.
enum OrderExpiryType {
  ORDER_EXPIRY_TYPE_UNSPECIFIED = 0;
  ORDER_EXPIRY_TYPE_GTC = 1; // Good Till Canceled
  ORDER_EXPIRY_TYPE_GFD = 2; // Good For Day
  ORDER_EXPIRY_TYPE_FAK = 3; // Fill And Kill
}

// Order type could be used to all types of orders whether it's smart order or
// not.
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum OrderTriggerType {
  ORDER_TRIGGER_TYPE_UNSPECIFIED = 0;
  ORDER_TRIGGER_TYPE_LTE = 1;
  ORDER_TRIGGER_TYPE_GTE = 2;
}

enum OrderBookSide {
  ORDER_BOOK_SIDE_UNSPECIFIED = 0;
  ORDER_BOOK_SIDE_BID = 1; // Represents the Buy order queue side of the order book.
  ORDER_BOOK_SIDE_ASK = 2; // Represents the Sell order queue side of the order book.
}

// OrderAnnotations represents additional annotations or notes related to any
// order, providing context or information about the order, structured using
// object format so it can be easily extended to capture all kinds of
// information, for example to differentiate system and display remarks.
message OrderAnnotations {
  // Human-readable text information related to the order. It could be used to
  // provide additional information to the user about certain order, this field
  // will be used to display remarks in the application side, so make sure it
  // does not contain any sensitive information or internal system remarks.
  //
  // Example: "Order was cancelled automatically due to insufficient Balance Lot
  // for ACES because a separate selling order that you made has been executed."
  //
  // Warning: This field may not be filled and it's not guaranteed to be filled
  // in all cases.
  string display_message = 1;
}
