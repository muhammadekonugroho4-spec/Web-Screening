syntax = "proto3";

package financial.common.v1;

import "google/type/decimal.proto";

option go_package = "go.stockbit.io/protos/gen/go/financial/common/v1;common";
option java_multiple_files = true;

message DecimalValue {
  google.type.Decimal raw = 1 [json_name = "raw"];
  string formatted = 2 [json_name = "formatted"];
}
